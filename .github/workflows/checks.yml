name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
      - run: python -m pip install pip-audit && pip-audit -r requirements.txt
      - name: Production settings check
        env:
          DEBUG: 'False'
          SECRET_KEY: 'ci-validation-key-only-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLM'
          ALLOWED_HOSTS: toolx.example.com
          PUBLIC_ORIGIN: https://toolx.example.com
          DATABASE_URL: postgresql://test:test@localhost:5432/toolx
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.com
          ADMIN_EMAIL: noreply@toolx.example.com
          AWS_STORAGE_BUCKET_NAME: ci-validation-only
          AWS_S3_REGION_NAME: us-east-1
        run: python manage.py check --deploy --fail-level WARNING
