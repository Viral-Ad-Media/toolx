

{% load static %}
{% block icon-bar %}

<!-- Add icon library -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<div class="icon-bar pt-5">
  <a href="/dashboard"><i class="fa fa-th-large"></i></a>
  <a href="/create"><i class="fa fa-sticky-note"></i></a>
