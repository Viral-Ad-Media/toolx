{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %} Preview {% endblock %}
{% block content %}


<div class="row">
    <div class="col sticky-top side-nav d-none d-lg-block">
        <a href="/">
          <img src="{% static 'img/alt-logo.png' %}" alt="logo" class="img-responsive">
        </a>
        {% block icon-bar %} {% include 'icon-bar.html' %} {% endblock icon-bar %}
    </div>

    <div class="col-10 mt-5 p-5">
        <h4>{{ original.Title }}</h4>
        <div>{{ original.Article|linebreaks }}</div>
        <a class="btn btn-primary" href="{% url 'edit_draft' original.pk %}">Edit draft</a>
    </div>
</div>
{% endblock %}
