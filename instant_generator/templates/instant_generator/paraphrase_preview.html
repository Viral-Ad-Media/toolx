{% extends "app_base.html" %}
{% block title %}Article draft preview{% endblock %}
{% block workspace %}
<header class="page-heading"><div><h1>Article draft preview</h1><p>Read your saved draft or return to editing.</p></div><div class="actions"><a class="btn btn-primary" href="{% url 'edit_draft' original.pk %}">Edit draft</a><a class="text-link" href="{% url 'paraphrase' %}">My article drafts</a></div></header>
<article class="document-sheet"><h2>{{ original.Title }}</h2><div class="document-section">{{ original.Article|linebreaks }}</div></article>
{% endblock %}
