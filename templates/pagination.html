{% if page.has_other_pages %}
<nav class="pagination" aria-label="History pages">
  {% if page.has_previous %}<a class="btn btn-secondary" href="?page={{ page.previous_page_number }}">Previous</a>{% endif %}
  <span aria-current="page">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-secondary" href="?page={{ page.next_page_number }}">Next</a>{% endif %}
</nav>
{% endif %}
