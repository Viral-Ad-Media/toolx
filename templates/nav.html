{% load static %}
<header class="site-header">
  <nav class="site-nav container" aria-label="{% if user.is_authenticated %}Workspace{% else %}Main{% endif %} navigation">
    <a class="brand" href="{% url 'index' %}" aria-label="ToolX home"><img src="{% static 'img/logo.png' %}" alt="ToolX" width="88" height="40"></a>
    <div class="nav-links">
      {% if user.is_authenticated %}
        {% include 'icon-bar.html' %}
      {% else %}
        <a href="{% url 'features' %}" {% if request.resolver_match.url_name == 'features' %}aria-current="page"{% endif %}>Features</a>
        <a href="{% url 'pricing' %}" {% if request.resolver_match.url_name == 'pricing' %}aria-current="page"{% endif %}>Account access</a>
        <a href="{% url 'login' %}" {% if request.resolver_match.url_name == 'login' %}aria-current="page"{% endif %}>Log in</a>
        <a class="nav-create" href="{% url 'signup' %}" {% if request.resolver_match.url_name == 'signup' %}aria-current="page"{% endif %}>Create account</a>
      {% endif %}
    </div>
  </nav>
</header>
