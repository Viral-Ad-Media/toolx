<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-label">Required</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}{{ field.errors }}{% endif %}
</div>
