{% extends 'base.html' %}
{% block title %}Password reset complete{% endblock %}
{% block content %}
{% include 'nav.html' %}
<main class="auth-layout container" id="main-content" tabindex="-1">
  <section class="auth-intro" aria-labelledby="account-heading">
    <h1 id="account-heading">Your password is ready.</h1>
    <p>You can now return to your workspace.</p>
  </section>
  <section class="auth-panel" aria-label="Password reset complete">
    <div class="status-copy">
      <p>Your password has been set.</p>
      <a class="btn btn-primary" href="{% url 'login' %}">Sign in</a>
    </div>
  </section>
</main>
{% endblock %}
