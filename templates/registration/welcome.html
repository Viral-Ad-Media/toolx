{% extends 'base.html' %}
{% block title %}Welcome{% endblock %}
{% block content %}
{% include 'nav.html' %}
<main class="auth-layout container" id="main-content" tabindex="-1">
  <section class="auth-intro" aria-labelledby="account-heading">
    <h1 id="account-heading">Welcome to Tool-X.</h1>
    <p>A workspace for sales letters and article drafts.</p>
  </section>
  <section class="auth-panel" aria-label="Welcome">
    <div class="status-copy">
      {% if user.is_authenticated %}
      <a class="btn btn-primary" href="{% url 'dashboard' %}">Open your workspace</a>
      {% else %}
      <a class="btn btn-primary" href="{% url 'signup' %}">Create an account</a>
      <a class="text-link" href="{% url 'login' %}">Log in</a>
      {% endif %}
    </div>
  </section>
</main>
{% endblock %}
