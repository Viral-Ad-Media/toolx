{% extends 'base.html' %}
{% block title %}Password changed{% endblock %}
{% block content %}
{% include 'nav.html' %}
<main class="auth-layout container" id="main-content" tabindex="-1">
  <section class="auth-intro" aria-labelledby="account-heading">
    <h1 id="account-heading">Password changed.</h1>
    <p>Your password has been updated.</p>
  </section>
  <section class="auth-panel" aria-label="Password changed">
    <div class="status-copy">
      <p>You’re ready to return to your saved work.</p>
      <a class="btn btn-primary" href="{% url 'dashboard' %}">Back to dashboard</a>
    </div>
  </section>
</main>
{% endblock %}
